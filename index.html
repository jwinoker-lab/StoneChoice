<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>StoneChoice</title>
<meta name="description" content="StoneChoice: an interactive decision aid for people considering kidney stone treatment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&display=swap">
<style>
/* Layout: one calm reading column under a "journey" rail where a small stone marks your place; cards only for things you act on. */
:root{
  /* palette: orchid #bd83ca, violet #9e29b5, periwinkle #9494d1, sky #6dc3df, azure #009adf, cobalt #003ca5 */
  --ground:#f8f6fc; --surface:#ffffff; --ink:#16121d; --muted:#4e4860; --line:#d8d3ea; --line-2:#ece8f5;
  --teal:#8a24a2; --teal-soft:#f3e8f7; --ochre:#00609c; --ochre-soft:#e3f3fa; --alert:#a42b20; --alert-soft:#fbe9e6;
  --peri:#9494d1; --peri-soft:#eeeefa; --stone:#9ea3a5;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(60,30,90,.06), 0 4px 16px rgba(60,30,90,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#16131c; --surface:#1f1a27; --ink:#efeaf6; --muted:#b9b0c9; --line:#3a3349; --line-2:#2a2434;
  --teal:#d39be2; --teal-soft:#3a2545; --ochre:#6dc3df; --ochre-soft:#14313f; --alert:#ff8c80; --alert-soft:#3b1c19;
  --peri:#a9a9e0; --peri-soft:#272640; --stone:#a7acae;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#16131c; --surface:#1f1a27; --ink:#efeaf6; --muted:#b9b0c9; --line:#3a3349; --line-2:#2a2434;
  --teal:#d39be2; --teal-soft:#3a2545; --ochre:#6dc3df; --ochre-soft:#14313f; --alert:#ff8c80; --alert-soft:#3b1c19;
  --peri:#a9a9e0; --peri-soft:#272640; --stone:#a7acae;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 120px}
h1,h2,h3,h4{font-family:var(--display);font-weight:650;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.2vw,2.9rem);font-weight:750;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,3.6vw,2rem)}
h3{font-size:1.2rem}
h4{font-size:1rem}
p{margin:0}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
.wrap{max-width:780px;margin:0 auto}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.lead{color:var(--muted);max-width:62ch}
.small{font-size:.86rem;color:var(--muted)}
.stack{display:grid;gap:16px}
.stack-lg{display:grid;gap:28px}

/* header + journey rail */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line-2)}
.brandrow{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:750;font-size:1.08rem;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:30px;height:30px}
.hbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem;cursor:pointer;color:var(--ink)}
.hbtn:hover{border-color:var(--teal)}
.rail{max-width:780px;margin:10px auto 0;position:relative;display:grid;grid-template-columns:repeat(8,1fr)}
.rail .track{position:absolute;left:6.25%;right:6.25%;top:12px;height:4px;border-radius:2px;background:var(--line)}
.rail .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--teal);transition:width .4s ease}
.stop{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--muted);font-size:.74rem;line-height:1.15;text-align:center}
.stop i{width:12px;height:12px;margin-top:8px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:block;transition:all .2s}
.stop.done i{background:var(--teal);border-color:var(--teal)}
.stop.cur{color:var(--ink);font-weight:700}
.stop.cur i{opacity:0}
.stop:disabled{cursor:default;opacity:.55}
.pebble img{display:block;width:26px;height:25px}
.pebble{position:absolute;top:1px;width:26px;height:25px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25));transform:translateX(-50%);transition:left .45s cubic-bezier(.5,1.4,.5,1);pointer-events:none}
.railtxt{display:none;max-width:780px;margin:6px auto 0;font-size:.85rem;color:var(--muted)}
@media (max-width:620px){.stop span{display:none}.railtxt{display:block}.brand{font-size:.98rem;white-space:nowrap}footer.nav small{display:none}footer.nav .btn{padding:11px 18px}}

main{margin-top:36px;display:grid;gap:28px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0;align-content:start}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;min-width:0;border:1px solid var(--line-2)}
.key{border-left:4px solid var(--teal);background:var(--teal-soft);padding:12px 16px;border-radius:0 8px 8px 0}
.key b{display:block;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.imp{border:2px solid var(--ink);border-radius:var(--r);padding:14px 18px;font-weight:700;background:var(--surface)}
.alert{border:2px solid var(--alert);background:var(--alert-soft);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px}
.alert h3{color:var(--alert)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:12px;justify-self:start;padding:4px 12px;font-size:.84rem;background:var(--teal-soft);color:var(--ink)}
.chip.tag{background:var(--ochre-soft);color:var(--ink)}
.chip svg{width:16px;height:16px}
ul.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.illo{width:100%;max-width:340px;height:auto;display:block;margin-inline:auto}
.hero-img{width:100%;max-width:300px;height:auto;display:block;margin-inline:auto;filter:drop-shadow(0 10px 24px rgba(90,30,120,.18))}
.illo .wall{fill:none;stroke:var(--ink);stroke-width:12;stroke-linejoin:round;stroke-linecap:round}
.illo .cav{fill:var(--peri-soft);stroke:var(--ink);stroke-width:10;stroke-linejoin:round}
.illo .stone{fill:var(--stone);stroke:var(--ink);stroke-width:5}
.illo .flow{fill:none;stroke:var(--teal);stroke-width:8;stroke-linecap:round;stroke-dasharray:2 22}
.illo .lbl{fill:var(--muted);font-family:var(--body);font-size:44px}
.illo .lblk{fill:var(--ink);font-family:var(--display);font-weight:650;font-size:48px}
.illo .organ{fill:var(--surface);stroke:var(--ink);stroke-width:8;stroke-linejoin:round}
.illo .tube{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.kfigs{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:20px 16px}
.kfigs figure{margin:0;display:grid;gap:10px;justify-items:center;align-content:start;text-align:center}
.kfigs .kfig{width:100%;max-width:230px;height:auto;display:block}
.kflow{animation:kflow 1.6s linear infinite}
@keyframes kflow{to{stroke-dashoffset:-92}}
.kfigs figcaption{font-size:.9rem;color:var(--muted);max-width:30ch}
.kfigs figcaption b{display:block;font-family:var(--display);font-size:1.1rem;color:var(--ink)}
.kfigs figcaption span{display:block;color:var(--teal);font-weight:700;margin-bottom:4px}
@media (max-width:480px){.kfigs{gap:8px;padding:14px 8px}.kfigs figcaption{font-size:.82rem}}
.illo .swell{fill:var(--peri-soft)}
@media (prefers-reduced-motion:no-preference){.illo .flow{animation:flow 2.4s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-48}}

/* buttons & inputs */
.btn{border:0;background:var(--teal);color:var(--surface);border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);text-decoration:underline;cursor:pointer;font-size:.9rem}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt label{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;background:var(--surface);font-size:.95rem;line-height:1.3}
.opt label:hover{border-color:var(--teal)}
.opt label:has(input:checked){border-color:var(--teal);background:var(--teal-soft);font-weight:700}
.opt input{accent-color:var(--teal);margin:0}
.opt.col{flex-direction:column;align-items:stretch}
.opt.col label{border-radius:10px}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{accent-color:var(--teal);margin-top:5px;flex:none;width:18px;height:18px}
.q{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--line-2)}
.q:first-child{border-top:0;padding-top:4px}
.qh{font-weight:700;font-size:1.02rem}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
input[type=number],input[type=search]{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
input[type=number]{width:120px}
input[type=search]{width:100%;max-width:340px}

/* sliders */
.sl{display:grid;gap:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--teal);border:4px solid var(--surface);box-shadow:0 0 0 1.5px var(--teal);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--teal);border:4px solid var(--surface);box-shadow:0 0 0 1.5px var(--teal)}
.sl.unset input[type=range]::-webkit-slider-thumb{background:var(--surface);box-shadow:0 0 0 2px var(--muted)}
.sl.unset input[type=range]::-moz-range-thumb{background:var(--surface);box-shadow:0 0 0 2px var(--muted)}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted)}
.ends span:last-child{text-align:right}
.ends span:nth-child(2):not(:last-child){text-align:center}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:.98rem}
.trade div:last-child{text-align:right}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.status.ok i{background:var(--teal)}

/* cards grid for options */
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.ocard{background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;text-align:left;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.ocard:hover{border-color:var(--teal)}
.ocard svg{width:48px;height:48px}
.ocard h3{font-size:1.05rem}
.ocard .nick{color:var(--muted);font-size:.9rem}
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.subnav button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.subnav button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ohead{display:flex;gap:16px;align-items:center}
.ohead svg{width:64px;height:64px;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab.on{color:var(--ink);border-bottom-color:var(--teal)}
.pros h4{color:var(--teal)}
.cons h4{color:var(--ochre)}
.pros,.cons{border-top:4px solid var(--teal)}
.cons{border-top-color:var(--ochre)}
.say{font-family:var(--display);font-size:1.15rem;font-weight:500;line-height:1.35}

/* icon arrays */
.icons{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:240px}
.icons i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.icons i.a{background:var(--ochre)}
.icons i.s{background:var(--teal)}
.icons i.r{background:repeating-linear-gradient(45deg,var(--teal) 0 1.5px,var(--teal-soft) 1.5px 3.2px)}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.band{border:1.5px solid var(--line-2);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.band.mine{border-color:var(--ochre);background:var(--ochre-soft)}
.band .big{font-family:var(--display);font-size:1.6rem;font-weight:750;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* table */
.tscroll{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line-2)}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--surface)}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
thead th{font-family:var(--display);font-size:.95rem;background:var(--teal-soft);position:sticky;top:0}
tbody th{font-weight:700;min-width:150px}
.refs{font-size:.78rem;color:var(--muted);display:grid;gap:6px}
.refs ol{margin:0;padding-left:1.4em;display:grid;gap:3px}

/* glossary */
.gl{display:grid;gap:0}
.gl div{display:grid;grid-template-columns:minmax(130px,220px) 1fr;gap:14px;padding-block:12px;border-top:1px solid var(--line-2)}
.gl dt{font-weight:700}
.gl dd{margin:0;color:var(--muted)}
@media (max-width:540px){.gl div{grid-template-columns:1fr;gap:2px}}
.term{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline dotted var(--teal);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
#pop{position:absolute;z-index:40;max-width:300px;background:var(--ink);color:var(--ground);border-radius:10px;padding:12px 14px;font-size:.9rem;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#pop b{display:block;margin-bottom:2px}
#pop button{margin-top:6px;background:none;border:0;padding:0;color:var(--ground);text-decoration:underline;cursor:pointer;font-size:.85rem}

.leftalone{display:flow-root}
.leftalone>*+*{margin-top:14px}
.leftalone h3{margin-bottom:6px}
.factbox{float:right;width:190px;margin:4px 0 12px 22px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;text-align:center;justify-items:center}
.factbox .factnum{font-family:var(--display);font-size:1.8rem;font-weight:750;color:var(--ochre);line-height:1}
.factbox .factnum span{font-size:.85rem;color:var(--muted);font-weight:500}
.factbox .icons{grid-template-columns:repeat(10,1fr);width:120px;max-width:120px;gap:2px}
.factbox p{font-size:.8rem;color:var(--muted);line-height:1.4}
.leftalone .key{clear:right}
@media (max-width:520px){.factbox{width:150px;margin-left:14px}.factbox .icons{width:110px;max-width:110px}}
.sfrdemo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sfrdemo .icons{grid-template-columns:repeat(10,1fr);width:130px;max-width:130px;flex:none}
.sfrdemo span{font-size:.9rem;color:var(--muted)}
.sfrdemo b{font-family:var(--display);font-size:1.4rem;color:var(--teal)}
.tract{margin:4px 0 0;border-radius:var(--r);overflow:hidden;background:#f8f6fc}
.tract img{display:block;width:100%;height:auto}
.stentfig{width:100%;max-width:270px;height:auto;display:block;margin-inline:auto}
.stentfig .sl-lead path{fill:none;stroke:var(--muted);stroke-width:3}
.stentfig .sl-txt text{fill:var(--ink);font-family:var(--body);font-weight:700;font-size:42px}
.stentfig .sl-sub text{fill:var(--muted);font-family:var(--body);font-size:36px}
/* kidney picker */
.kid{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
@media (max-width:560px){.kid{grid-template-columns:1fr}}
.kidney{width:240px;max-width:100%;height:auto;display:block}
.kidney .rgg{cursor:pointer;outline:none}
.kidney .rg{fill:var(--surface);stroke:none;transition:fill .15s}
.kidney .rgg:hover .rg{fill:var(--teal-soft)}
.kidney .rgg.on .rg{fill:var(--ochre-soft)}
.kidney .rgg:focus-visible .rg{fill:var(--teal-soft);stroke:var(--teal);stroke-width:8}
.kidney .pk-div{pointer-events:none}
.kidney .pk-div path{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:14 12;pointer-events:none}
.kidney .pk-div-ex{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:12 12;pointer-events:none}
.kidney .pk-ur{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;pointer-events:none}
.kidney .pk-lbl text{fill:var(--ink);font-family:var(--body);font-size:50px;text-anchor:middle;pointer-events:none;stroke:var(--surface);stroke-width:12px;stroke-linejoin:round;paint-order:stroke}
.kidney .pk-lbl text.on{font-weight:700;stroke:var(--ochre-soft)}

/* part C cards */
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.bcard{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:var(--surface);cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:.95rem;line-height:1.35}
.bcard .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.bcard.sel{border-color:var(--ochre);background:var(--ochre-soft)}
.bcard.sel .n{background:var(--ochre);border-color:var(--ochre);color:var(--surface)}

/* summary */
.stabs{display:flex;gap:6px;flex-wrap:wrap}
.stabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.stabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.meter{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:5px}
.prio{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,160px);gap:14px;align-items:center}
.line{position:relative;height:22px;margin-inline:10px}
.line::before{content:"";position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:var(--line)}
.line::after{content:"";position:absolute;left:50%;top:5px;width:2px;height:13px;background:var(--line)}
.line i{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:var(--teal);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--teal);transform:translateX(-50%)}
.toff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:10px;align-items:center;font-size:.9rem}
.toff span:last-child{text-align:right}
.fitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fit{border:1.5px solid var(--line-2);border-radius:var(--r);padding:14px;display:grid;gap:6px;align-content:start;font-size:.9rem;min-width:0}
.fit h4{font-size:1rem}
.fit .lbl{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-top:6px}
.fit .lbl.f{color:var(--teal)}
.fit .lbl.p{color:var(--ochre)}
.fit ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.clin{font-size:.86rem;line-height:1.45;display:grid;gap:10px;font-variant-numeric:tabular-nums}
.clin .cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.clin .cb{border:1.5px solid var(--ink);border-radius:6px;padding:10px 12px;display:grid;gap:4px;min-width:0;background:var(--surface)}
.clin h4{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-family:var(--body);font-weight:700}
.clin .flag{color:var(--alert);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.kv span:nth-child(odd){color:var(--muted)}

/* nav */
footer.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
footer.nav .in{max-width:780px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
footer.nav small{color:var(--muted);font-size:.8rem;text-align:center}
.safety{max-width:780px;margin:28px auto 0;font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.safety svg{flex:none;width:18px;height:18px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header.top,footer.nav,.safety,.noprint,.stabs{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.panel{box-shadow:none;border-color:#999}
  .printboth [data-view]{display:grid!important}
}

 W:{nick:"Keep an eye on it",
  what:`You leave the stone where it is and check on it over time. Your urologist will usually repeat pictures (e.g., sonograms) every 6 to 12 months at first. If the stone grows or starts causing symptoms, you can choose treatment then.`,

  pro:["High chance of being stone-free after one procedure for small and medium stones.","Option for pieces to be removed (by basket or suction) instead of passed.","No needle pokes or cuts.","Can treat several stones in the same kidney, and sometimes both sides, at once. Can often be done while you keep taking some blood thinners."],

  sfr:[{band:"Under 10 mm",lo:50,hi:73},{band:"10–20 mm",lo:43,hi:43,note:"Drops as stones get closer to 20 mm."},{band:"Over 20 mm or complex (staghorn)",lo:15,hi:30,note:"Several sessions are often needed."}],
  when:"the stone is up to about 2 cm, including stones in the lower part of the kidney, or SWL is not suitable.",
  say:"I want the best chance of getting it all out in one go."},

/* ============ logic ============ */
function largestLoc(){const st=S.stone;return st.largest||(st.locs.length===1?st.locs[0]:null);}
function sizeBand(){const st=S.stone;if(st.sizeUnknown||st.size==null)return -1;return st.size<10?0:st.size<=20?1:2;}
function stoneTags(){
 const st=S.stone,tg={W:[],S:[],U:[],P:[]},sz=st.sizeUnknown?null:st.size;
 if(sz!=null){const lower=largestLoc()==="lower";
  if(sz<10){if(st.symptoms==="none"||!st.symptoms)tg.W.push("Often an option for small stones without symptoms");tg.S.push("Often used for stones this size");tg.U.push("Often used for stones this size");tg.P.push("Usually for larger stones");}
  else if(sz<=20&&!lower){tg.S.push("Often used for stones this size");tg.U.push("Often used for stones this size");tg.P.push("Usually for larger stones");}
  else if(sz<=20&&lower){tg.U.push("Often used for this size and location");tg.P.push("Often used for this size and location");tg.S.push("Works less well for larger lower-kidney stones");}
  else{tg.P.push("Often used for large stones");tg.U.push("May take more than one procedure");tg.S.push("Usually not a first choice this large");}}
 if(st.count==="4+"&&!tg.P.includes("Often used for large stones"))tg.P.push("Often used for many stones");
 if(Number(st.hu)>1000)tg.S.push("May break less well for hard stones");
 if(st.factors.includes("thinner")){tg.S.push("Blood thinners usually need stopping");tg.P.push("Blood thinners usually need stopping");}
 if(st.factors.includes("preg"))tg.S.push("Not done during pregnancy");
 if(st.factors.includes("onekid"))OPTS.forEach(o=>tg[o.k].push("Your team will weigh this carefully"));
 return tg;}

P[1]=()=>`<header class="stack"><span class="eyebrow">Step 1 of 7</span><h2>Learn about kidney stones</h2></header>
 <section class="stack"><h3>What is a kidney stone?</h3>
  <p>Your kidneys clean your blood and make urine. Urine flows from each kidney down a thin tube called the ${t("ureter","ureter")} into the bladder.</p>
  <p>A kidney stone is an actual rock that forms when minerals in urine stick together. Stones can be as small as a grain of sand or larger than a marble. About 1 in 10 people will have a kidney stone at some point in their life.</p>
  ${key("Problems such as severe pain, infection, and bleeding usually start when a stone moves out of the kidney and gets stuck in the ureter.")}${tractSvg()}</section>
 <section class="stack"><h3>“Not blocking”: what that means</h3>
  <p>Your stone is sitting inside the kidney, and urine can still drain normally. Doctors call this a ${t("nonob","non-obstructing")} stone. Many of these stones cause no symptoms at all. They are often found by chance on a scan done for another reason.</p>
  <p>A stone that is not causing a problem today may stay put for years. Or it may grow, or move into the ureter and cause a painful ${t("colic","stone attack")}.</p>
  ${key("Not causing trouble now does not mean it never will. It also does not mean every stone must be removed.")}${blockSvg()}</section>
 <section class="leftalone"><h3>What happens if a stone is left alone?</h3>
  <aside class="factbox"><div class="factnum">30 <span>out of 100</span></div>${icons(30,30,"a","30 of 100 people highlighted")}<p>Out of 100 people who watch a stone that is not causing symptoms, about 30 will have a stone attack or need a procedure within about 5 years.</p></aside>
  <p>No one can predict exactly what one stone will do. Doctors look at things that may raise the chance of future trouble, such as:</p>
  <ul class="list"><li>a larger stone (for example, 5 mm or bigger)</li><li>a stone that has been growing on scans</li><li>having had stone attacks before</li><li>where the stone sits in the kidney</li></ul>
  <p>If you choose to watch your stone and it later causes pain or grows, you can still choose treatment then.</p>
  ${key("Some watched, untreated stones never cause trouble. Some do. Your urologist can tell you more about your own stone(s).")}</section>
 <section class="panel"><h3>Stones often come back, whatever you choose</h3>
  <p>Even after all stones are removed, about half of people form a new stone within 10 years. Drinking enough fluid, some diet changes, and, for some people, medicines can lower that chance. Your urologist may suggest urine or blood tests to find out why you make stones.</p>
  ${key("Treating a stone removes the stone you have now. Prevention helps with the stones you might form later.")}</section>`;

const GLOSS=[
 ["Your stone",[["Non-obstructing stone","A stone that is not blocking urine from draining out of the kidney."],["Obstruction / blockage","A stone stuck where it stops urine draining. Can cause severe pain and infection."],["Hydronephrosis","Swelling of the kidney because urine is backed up. A sign of blockage."],["Stone size (mm)","Usually the longest width. 10 mm = 1 cm, about the size of a pea."],["Stone burden","The total amount of stone: all stones added together, not just the largest."],["Stone location","Where the stone sits: the upper, mid, or lower part of the kidney (the “poles”), or the central funnel (renal pelvis)."],["Lower pole","The bottom part of the kidney. Pieces here can find it harder to drain out of the kidney due to gravity. Stones in here can also be more difficult to treat due to the kidney anatomy."],["Stone density / Hounsfield units (HU)","A CT number showing how hard a stone is. Very hard stones (often above about 1,000 HU) break less well with SWL."],["Stone type","What the stone is made of (e.g., calcium oxalate)."],["Staghorn stone","A large, branching stone that fills much of the kidney's drainage system."]]],
 ["Procedures",[["Active surveillance","Watching a stone with regular pictures (e.g., sonograms) instead of treating it now."],["Shockwave Lithotripsy (SWL)","Breaking a stone with sound waves from outside the body."],["Ureteroscopy (URS)","Treating a stone with a thin camera passed through the urinary tract; no needle pokes."],["Percutaneous Nephrolithotomy (PCNL)","Removing a stone through a small tube placed with a needle poke in the back."],["Mini-PCNL","PCNL through a smaller tube, sometimes with suction."],["Laser lithotripsy","Using a laser through the scope to break a stone into dust or pieces."],["Suction","Tools that vacuum stone pieces out during URS or PCNL."],["General anesthesia","Medicine that puts you fully to sleep for the procedure."],["Sedation","Medicine that makes you relaxed and drowsy but not fully asleep."],["Pre-stenting / staged procedure","Placing a stent first to widen the ureter, then doing the main procedure 1–2 weeks later."]]],

function glossList(){const q=S.gq.trim().toLowerCase();return GLOSS.map(([g,items])=>{const it=items.filter(([a,b])=>!q||(a+" "+b).toLowerCase().includes(q));if(!it.length)return"";return `<section class="stack" style="gap:4px"><h3>${g}</h3><dl class="gl">${it.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl></section>`;}).join("")||`<p class="lead">No terms match “${esc(S.gq)}”.</p>`;}
P[3]=()=>`<header class="stack"><span class="eyebrow">Step 3 of 7 · Definitions</span><h2>Important terms to know</h2><p class="lead">Words you may hear from your urologist. You can open this page from the Definitions button at any time.</p></header>
 <div class="grid2">
 <section class="card"><h3>Ureteral stent</h3>${stentSvg()}
  <p>A soft, thin plastic tube placed inside the ureter, with one curled end in the kidney and the other in the bladder. You cannot see it from the outside.</p>
  <p><b>Why it is used:</b> After a procedure, the ureter can swell. A stent keeps urine draining and lets small pieces pass. Sometimes a stent is placed a week or two <i>before</i> ureteroscopy to widen a narrow ureter.</p>
  <p><b>How it feels:</b> Some people barely notice it. Many do notice it: about 8 in 10 people have at least some symptoms, such as:</p>
  <ul class="list"><li>needing to pee often or urgently</li><li>a burning or aching feeling when peeing</li><li>pain in the side or back, especially while peeing</li><li>blood in the urine, often more after activity</li><li>trouble sleeping or working comfortably</li></ul>
  <p><b>How long and how it comes out:</b> Usually a few days to 2 weeks after a procedure. Some stents have a thin string that comes out of the body so you or your doctor can pull it out. It is quick, and most people find it easier than they feared. Others are removed in clinic with a small camera. Stents must never be forgotten: your team will give you a removal date.</p>
  <p><b>Does everyone need one?</b> No. After an uncomplicated ureteroscopy, some people can safely go without one. Your surgeon decides during the procedure, so a stent-free plan cannot always be promised.</p></section>
 <div class="stack">
 <section class="card"><h3>Stone-free rate (SFR)</h3>
  <p>The share of people who have no stone left (or only tiny specks) on a scan after treatment. A stone-free rate of 80% means about 80 out of 100 people had no stone left.</p>
  <div class="sfrdemo">${icons(80,80,"s","80 of 100")}<span><b>80</b> out of 100 people stone-free</span></div>
  <p><b>Why it matters:</b> Pieces left behind can grow, cause a stone attack, or lead to another procedure. A higher stone-free rate means a better chance this is “one and done”.</p>
  <p><b>Why numbers differ:</b> Studies define “stone-free” differently (no fragments at all vs. fragments smaller than a few millimetres) and check with different scans (CT finds more than X-ray). Ask your urologist what “stone-free” means in the numbers they quote.</p></section>
 <section class="card"><h3>Residual fragments</h3><p>Small pieces of stone that stay in the kidney after treatment. Tiny pieces often pass on their own or cause no trouble. Some grow or move and cause pain or need another procedure.</p></section></div></div>

function kidneySvg(){const L=S.stone.locs,on=v=>L.includes(v)?"on":"";
 return `<svg class="kidney" viewBox="40 10 790 1040" role="group" aria-label="Kidney diagram: select every area with a stone">
 <defs><clipPath id="pk-body"><path d="${PK.body}"/></clipPath><mask id="pk-lines" maskUnits="userSpaceOnUse" x="0" y="0" width="944" height="1136"><image href="${KID_LINES}" x="40" y="20" width="760" height="1040"/></mask></defs>
 <path d="${PK.body}" fill="var(--surface)"/>
 ${[["upper",`<rect class="rg" x="0" y="0" width="944" height="330" clip-path="url(#pk-body)"/>`],["mid",`<rect class="rg" x="0" y="330" width="340" height="270" clip-path="url(#pk-body)"/>`],["lower",`<rect class="rg" x="0" y="600" width="944" height="536" clip-path="url(#pk-body)"/>`],["pelvis",`<rect class="rg" x="340" y="330" width="604" height="270" clip-path="url(#pk-body)"/><path class="rg" d="M574 410 C614 424 662 454 694 500 C712 530 722 560 727 592 L676 656 C658 642 640 632 620 630 C590 628 560 634 538 640 L540 600 L574 600 Z"/>`]].map(([v,shape])=>`<g class="rgg ${on(v)}" data-loc="${v}" tabindex="0" role="checkbox" aria-checked="${L.includes(v)}" aria-label="${LOCS.find(x=>x[0]===v)[1]}">${shape}</g>`).join("")}
 <rect x="40" y="20" width="760" height="1040" fill="var(--ink)" mask="url(#pk-lines)" style="pointer-events:none"/>
 <g clip-path="url(#pk-body)" class="pk-div"><path d="M0 330 H944 M0 600 H944 M340 330 V600"/></g>
 <path class="pk-div-ex" d="M727 592 L676 656"/>
 <path class="pk-ur" d="M572 408 C614 424 662 454 694 500 C722 545 738 600 744 680 L750 1000 M536 641 C590 628 640 628 668 650 C688 668 694 690 696 720 L700 1000"/>
 <g class="pk-lbl"><text x="400" y="100" class="${on("upper")}">Upper</text><text x="165" y="475" class="${on("mid")}">Mid</text><text x="390" y="880" class="${on("lower")}">Lower</text><text x="470" y="478" class="${on("pelvis")}">Renal</text><text x="470" y="532" class="${on("pelvis")}">pelvis</text></g></svg>`;}
P[4]=()=>{const st=S.stone,picked=LOCS.filter(([v])=>st.locs.includes(v));return `<header class="stack"><span class="eyebrow">Step 4 of 7 · Optional</span><h2>Tell us what you know about your stone</h2><p class="lead">You might find these details in your scan report or patient portal, or you can ask your care team. It is fine to skip any question.</p></header>
 <section class="card">
 <div class="q"><div class="qh">Which kidney?</div>${radios("st-side",[["L","Left"],["R","Right"],["B","Both"],["?","Not sure"]],st.side)}</div>
 <div class="q"><div class="qh">How many stones are in that kidney?</div>${radios("st-count",[["1","One"],["2-3","2–3"],["4+","4 or more"],["?","Not sure"]],st.count)}</div>
 <div class="q"><div class="qh">How big is the largest stone?</div>
  <div class="sl ${st.size==null?"unset":""}"><input type="range" id="st-size" min="1" max="30" value="${st.size??10}" ${st.sizeUnknown?"disabled":""} aria-label="Largest stone size in millimetres"><div class="ends"><span>1 mm</span><span id="sizeout" style="font-weight:700;color:var(--ink)">${st.sizeUnknown?"Unknown":st.size==null?"Move the slider":st.size+(st.size>=30?"+":"")+" mm"}</span><span>30+ mm</span></div></div>
  <div class="opt"><label><input type="checkbox" id="st-sizeunk" ${st.sizeUnknown?"checked":""}>I don't know</label></div><p class="small">Your report may say cm. 1 cm = 10 mm.</p></div>
 <div class="q"><div class="qh">Where is your stone(s)? (select all that apply)</div><div class="kid">${kidneySvg()}
  <div class="stack" style="align-content:start"><p class="lead">Tap each part of the kidney that has a stone. Tap again to clear it.</p>
  <div class="opt"><label><input type="checkbox" id="st-locunsure" ${st.locUnsure?"checked":""}>Not sure</label></div>
  ${picked.length>1?`<div class="stack" style="gap:8px"><div class="qh">Which area has the largest stone? (if known)</div>${radios("st-largest",[...picked,["?","Not sure"]],st.largest)}</div>`:""}</div></div></div>
 <div class="q"><div class="qh">Stone density (${t("hu","Hounsfield units")}), if on your CT report</div><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><input type="number" id="st-hu" min="0" max="3000" value="${esc(st.hu)}" aria-label="Hounsfield units"><span class="small">HU · leave blank if not sure</span></div></div>
 <div class="q"><div class="qh">Has this stone caused symptoms?</div>${radios("st-symptoms",[["none","None that I know of"],["aches","Aches I think might be the stone"],["attack","A stone attack"],["er","An emergency visit or hospital stay"]],st.symptoms)}</div>
 </section>
 <section class="card"><h3>Do any of these apply to you?</h3><div class="checks">${FACTORS.map(([k,l])=>`<label><input type="checkbox" data-factor="${k}" ${st.factors.includes(k)?"checked":""}>${l}</label>`).join("")}</div></section>
 <section class="card"><div class="qh">Has your urologist suggested an option yet?</div>${radios("st-suggested",[["none","Not yet"],["W","Surveillance"],["S","SWL"],["U","URS"],["P","PCNL"],["multi","More than one"],["?","Not sure"]],st.suggested)}</section>`;};

function aSlider(it){const v=S.A[it.id];return `<div class="q"><div class="qh" id="l-${it.id}">${it.text}</div>
 <div class="sl ${v==null?"unset":""}"><input type="range" min="0" max="10" step="1" value="${v??5}" data-a="${it.id}" aria-labelledby="l-${it.id}">
 <div class="ends"><span>Not important</span><span>Somewhat</span><span>Extremely important</span></div></div>
 <div class="qfoot"><span class="status ${v==null?"":"ok"}"><i></i>${v==null?"Not answered yet":"Answered"}</span><button class="linkbtn" type="button" data-skipa="${it.id}">Skip</button></div></div>`;}
function bSlider(it){const v=S.B[it.id];return `<div class="q"><div class="trade"><div>${it.l}</div><div>${it.r}</div></div>
 <div class="sl ${v==null?"unset":""}"><input type="range" min="-5" max="5" step="1" value="${v??0}" data-b="${it.id}" aria-label="${esc(it.l)}, versus, ${esc(it.r)}">
 <div class="ends"><span>Strongly</span><span>Both equal</span><span>Strongly</span></div></div>
 <div class="qfoot"><span class="status ${v==null?"":"ok"}"><i></i>${v==null?"Not answered yet":"Answered"}</span><button class="linkbtn" type="button" data-skipb="${it.id}">Skip</button></div></div>`;}
P[5]=()=>{const ten=tensions();return `<header class="stack"><span class="eyebrow">Step 5 of 7</span><h2>What matters to you</h2><p class="lead">There are no right or wrong answers. Think about your own life, not what others might choose.</p></header>
 <section class="card"><span class="eyebrow">Part A</span><h3>Treat now, or keep watching?</h3><p class="lead">How important is each of these to you?</p>${A_ITEMS.map(aSlider).join("")}</section>
 <section class="card"><span class="eyebrow">Part B</span><h3>If you choose treatment, which matters more to you?</h3><p class="lead">Every treatment involves trade-offs. Even if you are leaning toward watching your stone, please answer these. They help if you change your mind or your stone changes. Move each marker toward the side that matters more.</p>${B_ITEMS.map(bSlider).join("")}</section>
 ${ten.length?`<section class="card" style="border:2px solid var(--ochre)"><span class="eyebrow" style="color:var(--ochre)">One more question</span>${ten.map(x=>`<div class="q"><p>You gave strong answers that pull in different directions: <b>${x.l.toLowerCase()}</b> and <b>${x.r.toLowerCase()}</b>. That's common; many people feel both. If you had to choose, which matters more?${x.hint?` <i>${x.hint}</i>`:""}</p>
  <div class="trade"><div>${x.l}</div><div>${x.r}</div></div><div class="sl ${S.C[x.id]==null?"unset":""}"><input type="range" min="-5" max="5" value="${S.C[x.id]??0}" data-c="${x.id}" aria-label="${esc(x.l)}, versus, ${esc(x.r)}"><div class="ends"><span>Strongly</span><span>Both equal</span><span>Strongly</span></div></div></div>`).join("")}</section>`:""}
 <section class="card"><span class="eyebrow">Part C</span><h3>What would bother you most?</h3><p class="lead">Imagine each of these happened to you. Tap the three that would bother you most, in order. Tap again to remove one.</p>
 <div class="bcards">${BOTHER.map(b=>{const i=S.bother.indexOf(b.id);return `<button type="button" class="bcard ${i>=0?"sel":""}" data-bother="${b.id}" aria-pressed="${i>=0}"><span class="n">${i>=0?i+1:""}</span><span>${b.t}</span></button>`;}).join("")}</div>
 <p class="small">${S.bother.length}/3 chosen</p></section>`;};

P[6]=()=>{const sureDone=S.sure.every(x=>x!=null),sureN=S.sure.filter(Boolean).length;return `<header class="stack"><span class="eyebrow">Step 6 of 7</span><h2>Check and reflect</h2></header>
 <section class="card"><h3>Quick check</h3><p class="lead">Let's check the key facts. This is not a test. Wrong answers just show you what to ask about.</p>
 ${QUIZ.map(z=>{const v=S.quiz[z.id];return `<div class="q"><div class="qh">${z.t}</div>${radios("qz-"+z.id,[["true","True"],["false","False"],["unsure","Not sure"]],v===true?"true":v===false?"false":v==="unsure"?"unsure":null)}
 ${v!=null?`<div class="key" style="${v===z.a?"":"border-color:var(--ochre);background:var(--ochre-soft)"}"><b style="${v===z.a?"":"color:var(--ochre)"}">${v===z.a?"Correct":"The answer is "+(z.a?"true":"false")}</b>${z.why}</div>`:""}</div>`;}).join("")}</section>
 <section class="card"><h3>Where are you leaning right now?</h3><p class="lead">It's fine to be unsure. You can change your mind at any time.</p>
 <div class="sl ${S.lean==null?"unset":""}"><input type="range" min="-2" max="2" value="${S.lean??0}" id="lean" aria-label="Keep watching my stone, versus, treat my stone"><div class="ends"><span>Keep watching my stone</span><span>Unsure</span><span>Treat my stone</span></div></div>
 <div class="qh" style="margin-top:10px">If you had treatment, which are you leaning toward? (choose any)</div>
 <div class="opt">${[["S","Shockwave Lithotripsy (SWL)"],["U","Ureteroscopy (URS)"],["P","Percutaneous Nephrolithotomy (PCNL)"],["?","Not sure yet"]].map(([k,l])=>`<label><input type="checkbox" data-consider="${k}" ${S.considering.includes(k)?"checked":""}>${l}</label>`).join("")}</div></section>
 <section class="card"><h3>How ready do you feel?</h3>
 ${SURE.map(([L,name,q],i)=>`<div class="q"><div class="qh"><span style="font-family:var(--display);color:var(--teal)">${L}</span> · ${q}</div>${radios("sure-"+i,[["yes","Yes"],["no","No"]],S.sure[i]===true?"yes":S.sure[i]===false?"no":null)}</div>`).join("")}
 ${sureDone&&sureN<4?`<div class="key" style="border-color:var(--ochre);background:var(--ochre-soft)"><b style="color:var(--ochre)">That's normal</b>You may want more information or support. Your urologist can help.</div>`:""}
 <p class="small">SURE test: O'Connor AM, Légaré F, Stacey D. SURE Test.</p></section>
 <section class="card"><h3>What would you like to do next?</h3>${radios("nextstep",[["decide","I'm ready to decide with my urologist at my next visit."],["talk","I want to talk it over with family or friends first."],["more","I want more information before deciding."],["rec","I'd like my urologist to recommend what to do."]],S.next,true)}</section>`;};

function lineDot(v,min,max){return `<div class="line" aria-hidden="true"><i style="left:${((v-min)/(max-min))*100}%"></i></div>`;}
function summaryYou(){const al=alignment(),tg=stoneTags(),pl=partALean(),top=A_ITEMS.filter(i=>S.A[i.id]!=null).sort((a,b)=>S.A[b.id]-S.A[a.id]).slice(0,3);
 return `<section class="card"><h3>1 · Where you're leaning</h3><div class="ends" style="font-size:.9rem"><span>Keep watching</span><span>Treat</span></div>${S.lean!=null?lineDot(S.lean,-2,2):""}
 <p>You said you are <b>${selfLeanWord(S.lean)}</b>. Your answers about what matters to you look <b>${leanWord(pl)}</b>.</p></section>
 <section class="card"><h3>2 · What matters most to you</h3>${top.length?top.map(i=>`<div class="prio"><span>${cap(i.short)}</span><div class="meter"><i style="width:${S.A[i.id]*10}%"></i></div></div>`).join(""):`<p class="lead">You haven't answered Part A yet.</p>`}</section>
 <section class="card"><h3>3 · Your trade-offs</h3>${B_ITEMS.filter(b=>S.B[b.id]!=null).map(b=>`<div class="toff"><span>${cap(b.ls)}</span>${lineDot(S.B[b.id],-5,5)}<span>${cap(b.rs)}</span></div>`).join("")||`<p class="lead">You haven't answered Part B yet.</p>`}</section>
 <section class="card"><h3>4 · What would bother you most</h3>${S.bother.length?`<ol class="list">${S.bother.map(id=>`<li>${BOTHER.find(b=>b.id===id).t}</li>`).join("")}</ol>`:`<p class="lead">Not answered.</p>`}</section>
 <section class="card"><h3>5 · How the options line up with what you said</h3><p class="lead">These are not scores or recommendations. They show which of your priorities each option fits, and which it pulls against.</p>
 <div class="fitgrid">${OPTS.map(o=>`<div class="fit"><h4>${o.name}</h4>${tg[o.k].slice(0,2).map(x=>`<span class="chip tag">${x}</span>`).join("")}
 <div class="lbl f">Fits</div>${al[o.k].fits.length?`<ul>${al[o.k].fits.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<span class="small">Nothing strong</span>`}
 <div class="lbl p">Pulls against</div>${al[o.k].pulls.length?`<ul>${al[o.k].pulls.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<span class="small">Nothing strong</span>`}</div>`).join("")}</div></section>
 <section class="panel" style="background:var(--teal-soft);border:0"><h3>6 · Whatever you decide</h3><p>Even if all stones are removed, new ones can form. Severe pain, fever, or vomiting: seek care right away.</p></section>`;}
function clinData(){const st=S.stone,pl=partALean(),ten=tensions(),locName=v=>(LOCS.find(x=>x[0]===v)||[,v])[1];
 const flags=[];FACTORS.forEach(([k,l])=>{if(st.factors.includes(k))flags.push(l.replace(/ \(e\.g\.,.*\)$/,""));});
 const sureN=S.sure.filter(x=>x===true).length;if(S.sure.every(x=>x!=null)&&sureN<4)flags.push("SURE "+sureN+"/4 (possible decisional conflict)");
 QUIZ.forEach(z=>{if(S.quiz[z.id]!=null&&S.quiz[z.id]!==z.a)flags.push("Missed "+z.id+": "+z.topic);});
 if(st.symptoms&&st.symptoms!=="none")flags.push("Reports symptoms from this stone");
 const self=S.lean,comp=pl==null?null:(pl<=-0.2?-1:pl>=0.2?1:0),selfB=self==null?null:Math.sign(self);
 const consist=self==null||comp==null?"":(selfB===comp?"consistent with self-rating":"differs from self-rating");
 const dec={self:"Patient decides",selfAfter:"Patient decides after urologist's opinion",shared:"Shared decision",docAfter:"Urologist decides after patient's opinion",doc:"Leaves it to urologist"}[S.decision]||"Not provided";
 const locTxt=st.locUnsure?"Not sure":st.locs.length?st.locs.map(locName).join(", ")+(largestLoc()?" (largest: "+(largestLoc()==="?"?"not sure":locName(largestLoc()))+")":""):"Not provided";
 const sugg={none:"Not yet",W:"Surveillance",S:"SWL",U:"URS",P:"PCNL",multi:"More than one","?":"Not sure"}[st.suggested]||"Not provided";
 const sym={none:"None",aches:"Possible aches",attack:"Stone attack",er:"ED visit / admission"}[st.symptoms]||"Not provided";
 return {st,pl,ten,flags,self,consist,dec,locTxt,sugg,sym};}
function summaryClin(){const d=clinData(),st=d.st,lbl={L:"Left",R:"Right",B:"Both","?":"Not sure"};
 return `<div class="clin"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b style="font-family:var(--display);font-size:1rem">StoneChoice summary · patient-reported</b><span>Date: __________ · Name: __________</span></div>
 <div class="cg"><div class="cb"><h4>Stone</h4><div class="kv"><span>Side</span><span>${lbl[st.side]||"Not provided"}</span><span>Count</span><span>${st.count||"Not provided"}</span><span>Largest</span><span>${st.sizeUnknown||st.size==null?"Not provided":st.size+" mm"}</span><span>Location</span><span>${d.locTxt}</span><span>HU</span><span>${st.hu||"Not provided"}</span><span>Symptoms</span><span>${d.sym}</span><span>Uro suggested</span><span>${d.sugg}</span></div></div>
 <div class="cb"><h4>Flags</h4>${d.flags.length?d.flags.map(f=>`<div class="flag">! ${esc(f)}</div>`).join(""):"<div>None</div>"}</div></div>
 <div class="cb"><h4>Decision</h4><div class="kv"><span>Style</span><span>${d.dec}</span><span>Self-rated lean</span><span>${selfLeanWord(d.self)}${d.self!=null?" ("+(d.self>0?"+":"")+d.self+" on −2..+2)":""}</span><span>Part A lean</span><span>${d.pl==null?"—":(d.pl>0?"+":"")+d.pl.toFixed(2)+" · "+leanWord(d.pl)}${d.consist?" · "+d.consist:""}</span><span>Considering</span><span>${S.considering.map(k=>({S:"SWL",U:"URS",P:"PCNL","?":"not sure"})[k]).join(", ")||"—"}</span><span>Next step</span><span>${{decide:"Decide at next visit",talk:"Talk with family/friends first",more:"Wants more information",rec:"Wants a recommendation"}[S.next]||"—"}</span></div></div>
 <div class="cg"><div class="cb"><h4>Importance (0–10)</h4><div class="kv">${A_ITEMS.slice().sort((a,b)=>(S.A[b.id]??-1)-(S.A[a.id]??-1)).map(i=>`<span>${i.id} ${cap(i.short)}</span><span>${S.A[i.id]??"skipped"}</span>`).join("")}</div></div>
 <div class="cb"><h4>Trade-offs (−5 left … +5 right)</h4><div class="kv">${B_ITEMS.map(b=>`<span>${b.id} ${cap(b.ls)} ↔ ${b.rs}</span><span>${S.B[b.id]??"skipped"}</span>`).join("")}</div></div></div>
 <div class="cb"><h4>Most bothersome</h4><div>${S.bother.map((id,i)=>(i+1)+". "+BOTHER.find(b=>b.id===id).t).join("   ")||"—"}</div></div>
 <div class="cb"><h4>Tensions to discuss</h4>${d.ten.length?d.ten.map(x=>`<div>• ${x.msg}${S.C[x.id]!=null?" → resolved toward "+(S.C[x.id]<0?x.l.toLowerCase():S.C[x.id]>0?x.r.toLowerCase():"neither"):""}</div>`).join(""):"<div>None triggered</div>"}</div></div>`;}
function summaryText(){const d=clinData(),al=alignment(),L=[];
 L.push("STONECHOICE SUMMARY (patient-reported)");
 L.push("Stone: side "+(d.st.side||"n/a")+"; count "+(d.st.count||"n/a")+"; largest "+(d.st.sizeUnknown||d.st.size==null?"n/a":d.st.size+" mm")+"; location "+d.locTxt+"; HU "+(d.st.hu||"n/a")+"; symptoms "+d.sym);
 L.push("Decision style: "+d.dec);L.push("Leaning: "+selfLeanWord(d.self)+"; Part A: "+leanWord(d.pl));
 L.push("Considering: "+(S.considering.map(k=>({S:"SWL",U:"URS",P:"PCNL","?":"not sure"})[k]).join(", ")||"n/a"));
 L.push("Importance: "+A_ITEMS.map(i=>i.id+"="+(S.A[i.id]??"-")).join(", "));
 L.push("Trade-offs: "+B_ITEMS.map(b=>b.id+"="+(S.B[b.id]??"-")).join(", "));
 L.push("Most bothersome: "+(S.bother.map(id=>BOTHER.find(b=>b.id===id).t).join("; ")||"n/a"));
 if(d.flags.length)L.push("Flags: "+d.flags.join("; "));
 if(d.ten.length)L.push("Tensions: "+d.ten.map(x=>x.msg).join("; "));
 OPTS.forEach(o=>L.push(o.col+" fits: "+(al[o.k].fits.join("; ")||"-")+" | pulls against: "+(al[o.k].pulls.join("; ")||"-")));
 return L.join("\n");}
const canPrint=(()=>{try{return window.self===window.top;}catch(e){return false;}})();
P[7]=()=>`<header class="stack"><span class="eyebrow">Step 7 of 7</span><h2>Your kidney stone decision summary</h2><p class="lead">This summary shows what matters most to you. It is not a medical recommendation. Bring it to your next visit so you and your urologist can decide together.</p></header>
 <div class="noprint" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center">
 <div class="stabs" role="tablist"><button type="button" role="tab" data-tab="you" class="${S.tab==="you"?"on":""}" aria-selected="${S.tab==="you"}">For you</button><button type="button" role="tab" data-tab="clin" class="${S.tab==="clin"?"on":""}" aria-selected="${S.tab==="clin"}">For your urologist</button></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${canPrint?`<button type="button" class="btn ghost" id="print">Print or save as PDF</button>`:""}<button type="button" class="btn ghost" id="copy">Copy summary</button></div></div>
 <div class="stack-lg">${S.tab==="you"?summaryYou():summaryClin()}</div>
 <textarea id="copybox" hidden readonly aria-label="Summary text"></textarea>`;

/* ============ render ============ */
function blocked(){const s=S.safety;return (s.pain||s.fever||s.blocked)&&!S.safetyOverride;}
function render(focus){
 const pct=S.step/7;
 $("#rail").innerHTML=`<div class="track"><div class="fill" style="width:${pct*100}%"></div></div>`+STEPS.map((n,i)=>`<button type="button" class="stop ${i<S.step?"done":""} ${i===S.step?"cur":""}" data-go="${i}" ${(i>S.maxStep+1||(blocked()&&i>0))?"disabled":""} aria-current="${i===S.step?"step":"false"}" aria-label="${n}${i<S.step?", done":""}"><i></i><span>${n}</span></button>`).join("")+`<div class="pebble" style="left:${6.25+pct*87.5}%">${PEBBLE}</div>`;
 $("#railtxt").textContent=S.step?`Step ${S.step} of 7 · ${STEPS[S.step]}`:"Start";
 $("#main").innerHTML=P[S.step]();
 $("#back").disabled=S.step===0;
 const nx=$("#next");
 if(S.step===0)nx.textContent="Start the guide";
 else if(S.step===2&&S.sub2!=="compare"){const nxt=SUB2[SUB2.indexOf(S.sub2)+1];nx.textContent="Next: "+SUBNAME[nxt];}
 else if(S.step===7)nx.textContent="Start over";
 else nx.textContent="Next: "+STEPS[S.step+1];
 nx.disabled=S.step===0&&blocked();
 $("#stepof").textContent=S.step?`${S.step} of 7`:"";
 hidePop();save();
}
function go(i,sub){S.step=Math.max(0,Math.min(7,i));if(sub)S.sub2=sub;S.maxStep=Math.max(S.maxStep,S.step);render();window.scrollTo({top:0});$("#main").focus({preventScroll:true});}
function toggleLoc(v){const L=S.stone.locs,i=L.indexOf(v);if(i>=0)L.splice(i,1);else{L.push(v);S.stone.locUnsure=false;}if(S.stone.largest&&S.stone.largest!=="?"&&!L.includes(S.stone.largest))S.stone.largest=null;render();document.querySelector(`[data-loc="${v}"]`)?.focus({preventScroll:true});}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function hidePop(){const p=$("#pop");if(p)p.hidden=true;}
function showPop(btn){const k=btn.dataset.term,p=$("#pop");p.innerHTML=`<b>${TERMS[k][0]}</b>${TERMS[k][1]}<br><button type="button" data-go="3">More in Definitions</button>`;p.hidden=false;
 const r=btn.getBoundingClientRect(),w=Math.min(300,window.innerWidth-32);p.style.maxWidth=w+"px";
 let x=r.left+window.scrollX;x=Math.min(x,window.scrollX+window.innerWidth-w-16);x=Math.max(16,x);p.style.left=x+"px";p.style.top=(r.bottom+window.scrollY+8)+"px";}

document.addEventListener("click",e=>{
 const term=e.target.closest(".term");if(term){e.preventDefault();showPop(term);return;}
 if(!e.target.closest("#pop"))hidePop();
 const g=e.target.closest("[data-go]");if(g&&!g.disabled){go(+g.dataset.go,+g.dataset.go===2?"overview":null);return;}
 const sub=e.target.closest("[data-sub]");if(sub){S.sub2=sub.dataset.sub;render();window.scrollTo({top:0});return;}
 const ex=e.target.closest("[data-exp]");if(ex){S.exp[ex.dataset.exp]=+ex.dataset.i;render();document.querySelector(`[data-exp="${ex.dataset.exp}"][data-i="${ex.dataset.i}"]`)?.focus({preventScroll:true});return;}
 if(e.target.id==="override"){S.safetyOverride=true;render();return;}
 const loc=e.target.closest("[data-loc]");if(loc){toggleLoc(loc.dataset.loc);return;}
 const sa=e.target.closest("[data-skipa]");if(sa){S.A[sa.dataset.skipa]=null;delete S.A[sa.dataset.skipa];render();return;}
 const sb=e.target.closest("[data-skipb]");if(sb){delete S.B[sb.dataset.skipb];render();return;}
 const bo=e.target.closest("[data-bother]");if(bo){const id=bo.dataset.bother,i=S.bother.indexOf(id);if(i>=0)S.bother.splice(i,1);else if(S.bother.length<3)S.bother.push(id);else{toast("You've chosen 3. Tap one to remove it first.");return;}render();document.querySelector(`[data-bother="${id}"]`)?.focus({preventScroll:true});return;}
 const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();return;}
 if(e.target.id==="print"){window.print();return;}
 if(e.target.id==="copy"){const txt=summaryText();const fallback=()=>{const b=$("#copybox");b.hidden=false;b.value=txt;b.style.minHeight="220px";b.select();toast("Select all and copy the text below.");};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Summary copied"),fallback);}catch(err){fallback();}return;}
});
document.addEventListener("keydown",e=>{const loc=e.target.closest&&e.target.closest("[data-loc]");if(loc&&(e.key===" "||e.key==="Enter")){e.preventDefault();toggleLoc(loc.dataset.loc);}if(e.key==="Escape")hidePop();});
function mark(el){const w=el.closest(".sl");if(w)w.classList.remove("unset");const s=el.closest(".q")?.querySelector(".status");if(s){s.classList.add("ok");s.lastChild.textContent="Answered";}save();}
document.addEventListener("input",e=>{const x=e.target;
 if(x.dataset.a){S.A[x.dataset.a]=+x.value;mark(x);return;}
 if(x.dataset.b){S.B[x.dataset.b]=+x.value;mark(x);return;}
 if(x.dataset.c){S.C[x.dataset.c]=+x.value;mark(x);return;}
 if(x.id==="st-size"){S.stone.size=+x.value;x.closest(".sl").classList.remove("unset");$("#sizeout").textContent=x.value+(+x.value>=30?"+":"")+" mm";save();return;}
 if(x.id==="st-hu"){S.stone.hu=x.value;save();return;}
 if(x.id==="lean"){S.lean=+x.value;mark(x);return;}
 if(x.id==="gq"){S.gq=x.value;$("#glist").innerHTML=glossList();save();return;}
});
document.addEventListener("change",e=>{const x=e.target,n=x.name||"";
 if(x.dataset.a||x.dataset.b){const k=x.dataset.a||x.dataset.b,sel=x.dataset.a?`[data-a="${k}"]`:`[data-b="${k}"]`;const y=window.scrollY;render();window.scrollTo({top:y});document.querySelector(sel)?.focus({preventScroll:true});return;}
 if(n.startsWith("sf-")){S.safety[n.slice(3)]=x.value==="yes";if(x.value==="yes")S.safetyOverride=false;const y=window.scrollY;render();window.scrollTo({top:y});return;}
 if(n==="decision"){S.decision=x.value;save();return;}
 if(n.startsWith("st-")){S.stone[n.slice(3)]=x.value;const y=window.scrollY;render();window.scrollTo({top:y});return;}
 if(x.id==="st-sizeunk"){S.stone.sizeUnknown=x.checked;render();return;}
 if(x.id==="st-locunsure"){S.stone.locUnsure=x.checked;if(x.checked){S.stone.locs=[];S.stone.largest=null;}const y=window.scrollY;render();window.scrollTo({top:y});return;}
 if(x.dataset.factor){const f=S.stone.factors,k=x.dataset.factor;x.checked?f.push(k):f.splice(f.indexOf(k),1);save();return;}
 if(n.startsWith("qz-")){S.quiz[n.slice(3)]=x.value==="true"?true:x.value==="false"?false:"unsure";const y=window.scrollY;render();window.scrollTo({top:y});return;}
 if(x.dataset.consider){const c=S.considering,k=x.dataset.consider;x.checked?c.push(k):c.splice(c.indexOf(k),1);save();return;}
 if(n.startsWith("sure-")){S.sure[+n.slice(5)]=x.value==="yes";const y=window.scrollY;render();window.scrollTo({top:y});return;}
 if(n==="nextstep"){S.next=x.value;save();return;}
});
$("#back").onclick=()=>{if(S.step===2&&S.sub2!=="overview"){S.sub2=SUB2[SUB2.indexOf(S.sub2)-1];render();window.scrollTo({top:0});return;}
 if(S.step===3){go(2,"compare");return;}go(S.step-1);};
$("#next").onclick=()=>{if(S.step===7){S=blank();render();window.scrollTo({top:0});return;}
 if(S.step===2&&S.sub2!=="compare"){S.sub2=SUB2[SUB2.indexOf(S.sub2)+1];render();window.scrollTo({top:0});return;}
 go(S.step+1,S.step+1===2?"overview":null);};
window.addEventListener("resize",hidePop);
render();
</script>

</body></html>
